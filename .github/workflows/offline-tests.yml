name: Offline application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-ocr.txt
      - run: python verify.py --full
      - run: node --check medai_readback/local_dashboard.js
      - run: node tests/test_ui_state.cjs medai_readback/local_dashboard.js
